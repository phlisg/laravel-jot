# Usage: PHP_VERSION=8.5 docker compose run --rm php composer test
services:
  php:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    image: laravel-wide-events-php:${PHP_VERSION:-8.3}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      COMPOSER_HOME: /app/.composer
